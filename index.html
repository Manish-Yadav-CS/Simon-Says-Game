<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="Stylesheet" href="style.css"/>
</head>
<body>
    <h1> Simon Says Game</h1>
    <h2>Press Any button to start the Game</h2>
    

    <div class="Button-container">

        <div id="highscore">
            <h3>HighScore</h3>
        </div>

        <div id="line1">
            <div  class="btn red" type="button" id="red" id="text" > Red</div>
            <div  class="btn purple" type="button" id="purple"  id="text">Purple</div>
        </div>
        
        <div id="line2">
            <div  class="btn green" type="button" id="green" id="text">Green</div>
            <div  class="btn yellow" type="button" id="yellow" id="text" >Yellow</div>
        </div>
    </div>


    <script src="app.js" ></script>
</body>
</html>
